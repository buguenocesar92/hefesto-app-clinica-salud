# =============================================================================
# nginx de ClinicaSalud
# =============================================================================
# Sirve `/var/www/html/public` y manda PHP a php-fpm por socket.
#
# Notamos dos cosas:
#   - `server_tokens off`: no anuncia la version de nginx.
#   - Cabeceras de endurecimiento para una aplicacion que maneja datos de
#     salud. No son un escudo completo, pero cada capa cuenta.
# =============================================================================

server {
    listen 8000;
    listen [::]:8000;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # `no-store` en toda respuesta: ni una agenda ni una ficha clinica pueden
    # quedar en el historial del navegador ni en un proxy intermedio.
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
    }

    # Nadie deberia pedir un archivo que no sea de `public`.
    location ~ /\. {
        deny all;
    }
}